<svg xmlns="http://www.w3.org/2000/svg" width="600" height="980" viewBox="0 0 600 980" role="img" aria-labelledby="title desc">
  <title id="title">评论追踪定时看帖与关注设置</title>
  <desc id="desc">红圈标出定时周期和立即执行按钮；点击立即执行会启动一轮看帖与关注。</desc>
  <image href="panel-tutorial-comment-settings.png" x="160" y="0" width="420" height="980" />
  <ellipse cx="364" cy="119" rx="188" ry="23" fill="none" stroke="#e4432f" stroke-width="4" />
  <rect x="5" y="70" width="145" height="58" rx="7" fill="#fff" stroke="#e4432f" stroke-width="2" />
  <text x="15" y="94" fill="#d73320" font-family="Arial, sans-serif" font-size="15" font-weight="700">设置自动运行</text>
  <text x="15" y="114" fill="#d73320" font-family="Arial, sans-serif" font-size="15" font-weight="700">周期与浮动间隔</text>
  <path d="M150 104 L178 118" fill="none" stroke="#e4432f" stroke-width="4" />
  <path d="M165 117 L180 120 L174 106" fill="none" stroke="#e4432f" stroke-width="4" />
  <ellipse cx="470" cy="952" rx="99" ry="23" fill="none" stroke="#e4432f" stroke-width="4" />
  <rect x="5" y="884" width="145" height="58" rx="7" fill="#fff" stroke="#e4432f" stroke-width="2" />
  <text x="15" y="908" fill="#d73320" font-family="Arial, sans-serif" font-size="15" font-weight="700">手动执行一轮</text>
  <text x="15" y="928" fill="#d73320" font-family="Arial, sans-serif" font-size="15" font-weight="700">看帖与关注</text>
  <path d="M150 924 L365 949" fill="none" stroke="#e4432f" stroke-width="4" />
  <path d="M355 940 L370 950 L357 957" fill="none" stroke="#e4432f" stroke-width="4" />
</svg>
