  <text x="330" y="30" fill="#d73320" font-family="Arial, sans-serif" font-size="16" font-weight="700">点击这里提取评论区用户</text>
  <path d="M510 41 L533 370" fill="none" stroke="#e4432f" stroke-width="3" />
