<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XFollower · UI preview</title>
<link rel="stylesheet" href="/src/entries/panel/styles/select-control.css"><link rel="stylesheet" href="/src/entries/panel/styles/panel.css"><link rel="stylesheet" href="/src/entries/panel/styles/admin.css"><link rel="stylesheet" href="/src/entries/panel/styles/brand-layout.css"><link rel="stylesheet" href="/src/entries/panel/styles/follow-queue-panel.css">
<style>body{margin:0;background:#eef3ef}#app{height:100vh}.preview-shell{display:grid;grid-template-columns:210px minmax(0,1fr);height:100vh}.preview-shell .sidebar{grid-row:1/3}.preview-main{padding:24px;min-width:0;overflow:auto}.preview-banner{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 18px;background:#e1eee5;color:#285d49;font:12px system-ui}.preview-card{max-width:680px;margin:16px auto;background:white;padding:24px;border:1px solid #dce6de;border-radius:10px}.preview-shell .mutual-comments{display:block;height:auto;max-height:none}.preview-shell .sidebar-language{padding:12px;color:#e3eee9}.preview-shell .nav-tab{height:auto;min-height:38px;white-space:normal;text-align:left;padding:9px 12px}.preview-shell .preview-title{font-size:20px;margin:0 0 20px;color:#24483b}.preview-shell .ai-form,.preview-shell .ai-create{grid-template-columns:140px minmax(0,1fr)}@media(max-width:700px){.preview-shell{grid-template-columns:minmax(0,1fr)}.preview-shell>.sidebar{display:none}.preview-main{padding:8px}.preview-card{padding:14px}.preview-banner{flex-wrap:wrap}.preview-banner .language-control{max-width:230px}}</style>
<div id="app"></div>
<script type="module">
import {createApp,nextTick,ref} from 'vue';
const params=new URL(location.href).searchParams;
const config={ownerId:'sample',scanEnabled:true,commentEnabled:true,scanProvider:'codex',commentProvider:'antigravity',scanBotId:'codex-example',commentBotId:'antigravity-example',scanIntervalMinutes:10,scanIntervalMaxMinutes:15,commentIntervalMinutes:3,commentIntervalMaxMinutes:8,scrollRounds:2,batchSize:30,perRun:3,dailyLimit:30,followBackSuffixEnabled:false,quoteTagsEnabled:false,quoteSelectedTags:[],quoteCustomTags:[]};
const calls={state:0,save:0,test:0,list:0,create:0};
const items=[{postId:'1001',handle:'example_maker',text:'Building a small design tool. Happy to connect with fellow makers!',reply:'What part of the design workflow are you improving?',tag:'mutual',status:'posted',createdAt:1793347200000,url:'https://x.com/example_maker/status/1001'},...['ready','ready','skipped'].map((status,i)=>({postId:String(1002+i),handle:['example_design','example_dev','example_notes'][i],text:['Sharing my product experiments. Let’s connect and learn together.','Working on a new browser extension. Open to feedback from other builders.','Notes from a quiet afternoon in the studio.'][i],tag:status==='skipped'?'not_mutual':'mutual',status,following:false,priority:{weight:1200-i*100,engagementScore:200-i*100},createdAt:1793347200000,url:'https://x.com/example/status/'+(1002+i)}))];
let fail=false,empty=false,delay=0;
function state(){return {ok:true,account:{accountId:'sample',handle:'example_owner'},config:{...config},items:empty?[]:items,total:empty?0:items.length,allTotal:items.length,page:1,counts:{ready:2,posted:1,skipped:1},tags:{mutual:3,not_mutual:1},scans:[{at:1793347200000,status:'completed',received:30,added:4}],running:{scan:false,comment:false}};}
globalThis.chrome={i18n:{getUILanguage:()=>params.get('lang')||'en'},runtime:{id:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',getURL:p=>'/src/assets/'+p,getManifest:()=>({version:'4.10.0'}),sendMessage:async m=>{if(m.action==='sidebarIdentity')return {ok:true,account:{handle:'example_owner',name:'Demo workspace'}};if(m.cmd==='mutualComments'){calls.state++;if(delay)await new Promise(r=>setTimeout(r,delay));if(fail)return {ok:false,error:'Preview: simulated service failure'};if(m.action==='save'){calls.save++;Object.assign(config,m.config);}return state();}return {ok:true,result:{snapshotCount:0},settings:{},status:{}};}},permissions:{request:async()=>true},storage:{onChanged:{addListener(){},removeListener(){}},local:{get:async()=>({}),set:async()=>{}}}};
const {LOCAL_AI_ENGINES,getLocalAiService}=await import('/src/features/grok/grok-local.js');

const {panelNavigationController}=await import('/src/entries/panel/composables/usePanelNavigation.js');panelNavigationController.setTab('mutualComments');
const {default:Sidebar}=await import('/src/entries/panel/components/PanelSidebar.vue');
const {default:Settings}=await import('/src/entries/panel/components/GrokLocalSettings.vue');
const {default:Feed}=await import('/src/entries/panel/pages/MutualCommentsSection.vue');
const {default:Tips}=await import('/src/entries/panel/components/InfoTipLayer.vue');
const mode=ref(params.get('mode')||'ai'),generation=ref(0);
createApp({components:{Sidebar,Settings,Feed,Tips},setup:()=>({mode,generation,t}),template:`<div class="preview-shell"><Sidebar/><div class="preview-main"><div class="preview-banner"><span>XFollower 4.10.0 · {{t('demoData')}}</span></div><div v-if="mode==='ai'" class="preview-card"><h1 class="preview-title">{{t('系统设置')}}</h1><Settings :key="generation" initial-provider="codex"/></div><Feed v-else/><Tips/></div></div>`}).mount('#app');
window.preview={calls,config,items,profiles,setLanguage:value=>{params.set('lang',value);refreshBrowserLanguage();},locale,reopen:async()=>{generation.value++;await nextTick();},failure:value=>fail=value,empty:value=>empty=value,delay:value=>delay=value,mode:async value=>{mode.value=value;await nextTick();}};
</script></html>
