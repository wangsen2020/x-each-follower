<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料缓存 UI 受控验收</title></head>
<body><div id="mount"></div><script>globalThis.chrome={i18n:{getUILanguage:()=> 'zh-CN'},runtime:{id:'cache-preview'}};</script>
<script type="module">
import {createApp,h} from 'vue';
import Drawer from '/src/entries/panel/components/ProfileDrawer.vue';
import Tips from '/src/entries/panel/components/InfoTipLayer.vue';
import {profileDrawerController} from '/src/entries/panel/composables/useProfileDrawer.js';
import {locale} from '/src/shared/i18n.js';
import '/src/entries/panel/styles/panel.css';
import '/src/entries/panel/styles/brand-layout.css';
const show=state=>{const at=Date.now(),posts=['ready','partial','stale'].includes(state)?[{handle:'sample',url:'https://x.com/sample/status/1',text:'受控样本，不调用真实 AI 或 X。',createdAt:at,textComplete:true}]:[];
  profileDrawerController.open({handle:'sample',id:'42',name:'资料缓存验收样本',bio:'缓存测试',followersText:'0',followingText:'100',profileObservedAt:at,
    profileEvidence:{ownerAccountId:'123',targetUserId:'42',observedAt:at},posts,
    fanInspectionTimeline:{ownerAccountId:'123',targetUserId:'42',status:state==='stale'?'ready':state,posts,fetchedAt:state==='stale'?at-21600001:['ready','partial','empty'].includes(state)?at:null,complete:state==='empty'}});
};
createApp({render:()=>h('main',{style:'display:block;padding:24px'},[h('p','资料缓存受控验收'),...['pending','ready','partial','empty','rate-limited','failed','stale'].map(state=>h('button',{onClick:()=>show(state)},state)),h(Drawer),h(Tips)])}).mount('#mount');
window.__profileCacheFixture={show,locale:value=>locale.value=value};show('ready');
</script></body></html>
