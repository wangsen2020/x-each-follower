<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · 隔离验收</title>
<link rel="stylesheet" href="/src/entries/panel/styles/panel.css"><link rel="stylesheet" href="/src/entries/panel/styles/admin.css"><link rel="stylesheet" href="/src/entries/panel/styles/brand-layout.css"><link rel="stylesheet" href="/src/entries/panel/styles/follow-queue-panel.css"><link rel="stylesheet" href="/src/entries/panel/styles/dashboard-load.css">
<style>body main.knowledge-preview{display:block;width:100%;max-width:1040px;height:100%;max-height:100%;margin:0 auto;padding:10px;overflow:auto}main.knowledge-preview>*{margin-left:0}main.knowledge-preview #app{margin:0;background:#fff;min-width:0}main.knowledge-preview>p{margin:0 0 10px;font-size:12px}#queue-tests[hidden]{display:none}</style>
<main class="knowledge-preview"><p><strong>知识库 · 隔离验收</strong>　独立网页数据，不修改扩展原有知识或发布内容。</p><div id="app"></div><section id="queue-tests" hidden><hr><div id="queue"></div><button id="generate">验证知识增强生成</button><button id="generate-real" hidden>验证评论草稿</button><pre id="result" style="white-space:pre-wrap"></pre></section></main>
<script type="module">
import {createApp,nextTick} from 'vue';
import Dexie from 'dexie';
const connection=await fetch('/acceptance/info').then(r=>r.json());
const local={ownPostTracking:{ownerId:'123'},'systemSettings:grokProvider':'grok-local'};
globalThis.chrome={runtime:{getURL:p=>'/'+p,sendMessage:async m=>{
  if(m.cmd==='followQueueIdentity')return {ok:true,accountId:'123'};
  if(m.cmd==='knowledgeLearning')return runtime.handle(m);
  return {ok:true};
}},storage:{local:{get:async k=>({[k]:local[k]}),set:async p=>Object.assign(local,p)},onChanged:{addListener(){},removeListener(){}}}};
const db=new Dexie('xfollower-grok-local');db.version(1).stores({config:'id',jobs:'id,key'});
await db.config.put({id:'local',bot:connection.bot,botName:connection.botName,port:8787,token:'preview-only',testedAt:Date.now()});
const {createKnowledgeStore}=await import('/src/features/knowledge/knowledge-store.js');
const {createKnowledgeQueue}=await import('/src/features/knowledge/knowledge-queue.js');
const {learningStore}=await import('/src/features/knowledge/learning-store.js');
const {createLearningRuntime}=await import('/src/features/knowledge/learning-runtime.js');
const {createFollowQueueStore}=await import('/src/features/follow-queue/follow-queue-store.js');
const library=createKnowledgeStore(),queueStore=createFollowQueueStore();
const bot={status:async()=>({enabled:true,bot:connection.bot,botName:connection.botName}),generate:async(prompt,opts)=>{
  const id='acceptance-'+crypto.randomUUID();await opts.onJobCreated({id:'local:'+id});return fetch('/acceptance/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,id})}).then(r=>r.json());
},resume:async id=>fetch('/acceptance/resume?id='+encodeURIComponent(id.slice(6))).then(r=>r.json())};
const runtime=createLearningRuntime({repository:learningStore,library,queue:createKnowledgeQueue({store:library}),owner:async()=>'123',bot,sources:async()=>connection.samples});
const {panelNavigationController}=await import('/src/entries/panel/composables/usePanelNavigation.js');panelNavigationController.activeTab.value='knowledge';
const {default:InfoTipLayer}=await import('/src/entries/panel/components/InfoTipLayer.vue');const tipsRoot=document.createElement('div');document.body.append(tipsRoot);createApp(InfoTipLayer).mount(tipsRoot);
const {default:Page}=await import('/src/entries/panel/pages/KnowledgeSection.vue');
const page=createApp(Page,{activeTab:'knowledge'}).mount('#app');
const {mountFollowQueuePanel}=await import('/src/entries/panel/follow-queue-panel.js');
const request=async m=>{
  if(m.cmd==='followQueueGetSettings')return {ok:true,settings:await queueStore.getSettings('123')};
  if(m.cmd==='followQueueSaveSettings')return {ok:true,settings:await queueStore.saveSettings('123',m.settings)};
  if(m.cmd==='followQueueSummary')return {ok:true,summary:{counts:{},total:0}};
  if(m.cmd==='followQueueList')return {ok:true,jobs:[],items:[],total:0};
  return {ok:true,settings:await queueStore.getSettings('123'),jobs:[],summary:{counts:{},total:0}};
};
const showQueueTests=new URLSearchParams(location.search).get('queue')==='1';
document.querySelector('#queue-tests').hidden=!showQueueTests;
const queuePanel=showQueueTests?mountFollowQueuePanel(document.querySelector('#queue'),{accountId:'123',request}):null;
document.querySelector('#generate').onclick=async()=>{
  const settings=await queueStore.getSettings('123');
  const {loadExperienceContext}=await import('/src/features/knowledge/learning-context.js');
  const context=settings.knowledgeEnabled?await loadExperienceContext({ownerId:'123',text:'产品功能发布与技术讨论',requestId:crypto.randomUUID()}):{text:'',items:[]};
  document.querySelector('#result').textContent=JSON.stringify({knowledgeEnabled:settings.knowledgeEnabled,selected:context.items},null,2);
};
document.querySelector('#generate-real').hidden=!connection.real;
document.querySelector('#generate-real').onclick=async()=>{
 const settings=await queueStore.getSettings('123');
 const {requestGrokComment,parseGrokQuoteDecision}=await import('/src/features/grok/grok-comment.js');
 const post={url:'https://x.com/acceptance/status/222',textComplete:true,text:'我们把本地数据处理从逐条请求改为分批处理，耗时下降了，但首次加载的等待仍然比较长。'};
 const ask=async(prompt,nonce,sleep,count)=>{window.acceptance.lastCommentPrompt=prompt;const result=await bot.generate(prompt,{onJobCreated:async()=>{}});return result.ok?{...result,...parseGrokQuoteDecision(result.text,count)}:result;};
 document.querySelector('#result').textContent='正在生成验收草稿，不发布…';
 try{const result=await requestGrokComment('acceptance',[post],'验收样本',{writerAccountId:'123',knowledgeEnabled:settings.knowledgeEnabled,askers:[ask],qualityFirst:true,qualityGate:false,sleep:async()=>{}});window.acceptance.latest=result;document.querySelector('#result').textContent=JSON.stringify(result,null,2);}catch(e){document.querySelector('#result').textContent=e.message;}
};
window.acceptance={tick:nextTick,runtime,library,learningStore,queueStore,queuePanel,page,connection};
</script></html>
