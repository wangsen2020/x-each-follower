import {mountFollowQueuePanel,DEFAULT_SETTINGS} from '../../src/entries/panel/follow-queue-panel.js';
import '../../src/entries/panel/styles/follow-queue-panel.css';
window.confirm=()=>true;let jobs=[{id:'fixture',handle:'test_only',state:'uncertain',sources:[],profile:{name:'隔离测试账号'}}];
