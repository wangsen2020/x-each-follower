<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核设置受控验收</title><link rel="stylesheet" href="/src/entries/panel/styles/panel.css"><link rel="stylesheet" href="/src/entries/panel/styles/admin.css"><link rel="stylesheet" href="/src/entries/panel/styles/brand-layout.css"><link rel="stylesheet" href="/src/entries/panel/styles/follow-queue-panel.css"><link rel="stylesheet" href="/src/entries/panel/styles/select-control.css"></head>
<body><main style="display:block;padding:24px"><h1>审核设置受控验收</h1><p>此页使用隔离测试数据，不调用真实 AI 或 X。</p><button id="open-fans">粉丝初审配置</button><button id="open-queue">队列配置</button><button id="open-drawer">粉丝设置抽屉</button><div id="mount"></div></main>
<script>
globalThis.chrome={i18n:{getUILanguage:()=> 'zh-CN'},runtime:{id:'review-fixture'}};
globalThis.__reviewFixture={requests:[],failSave:false,failLoad:false,disconnect:false,settings:{
initialReviewEnabled:false,followBackSkipRules:false,ratioLimit:10,
fanTagging:{provider:'',botId:'',prompt:'',batchSize:10,intervalSeconds:3},
queueTagging:{provider:'',botId:'',prompt:'',batchSize:10,intervalSeconds:3},
commentEngine:{provider:'',botId:'',prompt:''}}};
</script>
<script type="module">
import {createApp,h} from 'vue';
import Settings from '/src/entries/panel/components/FollowReviewSettingsDialog.vue';
import Drawer from '/src/entries/panel/components/SettingsDrawer.vue';
import {useSettingsDrawer} from '/src/entries/panel/composables/useSettingsDrawer.js';
import InfoTipLayer from '/src/entries/panel/components/InfoTipLayer.vue';
import {openFollowReviewSettings} from '/src/entries/panel/follow-review-settings.js';
import {locale} from '/src/shared/i18n.js';
const fixture=globalThis.__reviewFixture;
const request=async message=>{
  fixture.requests.push(structuredClone(message));
  if(fixture.hangLoad && message.cmd==='followQueueReviewSettings' || fixture.hangSave && message.cmd==='followQueueSaveReviewSettings')return new Promise(()=>{});
  if(message.cmd==='followQueueReviewSettings')return fixture.failLoad?{ok:false,error:'受控读取失败'}:{ok:true,settings:structuredClone(fixture.settings)};
  if(message.cmd==='followQueueSaveReviewSettings'){
    if(fixture.failSave)return {ok:false,error:'受控保存失败'};
    for(const[key,value]of Object.entries(message.settings))fixture.settings[key]=structuredClone(value);
    return {ok:true,settings:structuredClone(fixture.settings)};
  }
  throw Error('Unexpected fixture request');
};
const inspect=async provider=>fixture.hangInspect?new Promise(()=>{}):({connected:!fixture.disconnect&&Boolean(provider),supported:!['grok','grok-bot'].includes(provider),reason:fixture.disconnect?'受控连接失败':'',sessions:[
{id:'fixture-initial',name:'测试 · 粉丝初审',title:'测试会话：粉丝初审与描述打标专用会话，完整长标题应可阅读'},
{id:'fixture-queue',name:'测试 · 队列打标',title:'测试会话：关注队列完整资料与前十条帖子打标专用会话'},
{id:'fixture-comment',name:'测试 · 评论',title:'测试会话：独立评论创作会话'}]});
const drawer=useSettingsDrawer({timeoutMs:100});fixture.monitorSaves=[];
drawer.setSaveHandler(async config=>{fixture.monitorSaves.push(structuredClone(config));if(fixture.hangMonitorSave)return new Promise(()=>{});});
drawer.setReloadHandler(async()=>({every:10,jitter:3,enabled:false}));
fixture.openDrawer=()=>drawer.open({every:10,jitter:3,enabled:false});
document.getElementById('open-drawer').onclick=fixture.openDrawer;
createApp({render:()=>h('div',[h(Settings,{request,inspect,timeoutMs:300}),h(Drawer,{controller:drawer,reviewRequest:request,reviewInspect:inspect,timeoutMs:300}),h(InfoTipLayer)])}).mount('#mount');
document.getElementById('open-fans').onclick=()=>openFollowReviewSettings('fans');
document.getElementById('open-queue').onclick=()=>openFollowReviewSettings('queue');
fixture.locale=value=>{locale.value=value;};
fixture.ready=true;
</script></body></html>
