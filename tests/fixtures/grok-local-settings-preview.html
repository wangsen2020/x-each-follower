<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 引擎 · 隔离验收</title>
<style>body{margin:0;padding:10px;background:#eef3ef;color:#24483b;font:12px/1.6 system-ui}main{max-width:575px;margin:auto;background:white;padding:10px;border-radius:10px}button{border:1px solid #bed2c4;border-radius:6px;padding:0 10px;background:#24594a;color:white;cursor:pointer}button.secondary{background:#eef3ef;color:#24594a}button:disabled{opacity:.55}input,select{border:1px solid #bed2c4;border-radius:6px;padding:0 10px}h1{font-size:16px}.preview-note{color:#607c70;font-size:12px}a{color:#24594a}</style>
<main><h1>AI 引擎 · 隔离验收</h1><p class="preview-note">真实 Vue 组件，使用示例连接和模拟回复，不访问 AI 或扩展业务数据。</p><div id="app"></div></main>
<script type="module">
import {createApp,nextTick} from 'vue';
import '/src/entries/panel/styles/select-control.css';
globalThis.chrome={runtime:{id:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'},permissions:{request:async()=>true}};
const {LOCAL_AI_ENGINES,getLocalAiService}=await import('/src/features/grok/grok-local.js');
const profiles=new Map([['grok-local',{port:9876,token:'example-secret',bot:'grokbot-example',botName:'原有 Grok 会话',testedAt:42}]]),calls={list:0,test:0,create:0};let shared={port:9876,baseUrl:'http://127.0.0.1:9876',token:'example-secret'};
for(const {provider,engine,label} of LOCAL_AI_ENGINES){const client=getLocalAiService(provider);let created=false;
 client.configuration=async()=>({...profiles.get(provider),...shared,engine});
 client.status=async()=>({enabled:Boolean(profiles.get(provider)?.testedAt),...profiles.get(provider),baseUrl:shared.baseUrl});
 client.health=async()=>({ok:true,status:'ready'});
 client.list=async()=>{calls.list++;return [ ...(new URL(location.href).searchParams.has('stress')?Array.from({length:260},(_,i)=>({id:engine+'-stress-'+i,name:i===0?'  \n\t'+ '长标题'.repeat(3000):'真实会话标题 '+i})):[]),{id:engine+'-example',name:label+' 专用会话'},...(created?[{id:engine+'-new',name:'新建会话'}]:[])];};
 client.test=async config=>{calls.test++;shared={baseUrl:config.baseUrl,token:config.token};profiles.set(provider,{...config,botName:(await client.list()).find(s=>s.id===config.bot)?.name,testedAt:Date.now()});return 'XFollower 连接成功。';};
 client.createSession=async()=>{calls.create++;created=true;return {session:{id:engine+'-new',name:'新建会话'}};};
}
const {default:Settings}=await import('/src/entries/panel/components/GrokLocalSettings.vue');let app;
function mount(){app=createApp(Settings);app.mount('#app');}
window.guideAcceptance={calls,reopen:async()=>{app.unmount();mount();await nextTick();},saved:()=>Object.fromEntries(profiles)};mount();
</script></html>
