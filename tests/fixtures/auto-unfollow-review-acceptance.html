<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动取关人工审核验收</title>
<link rel="stylesheet" href="/src/entries/panel/styles/brand-layout.css"><link rel="stylesheet" href="/src/entries/panel/styles/panel.css">
<style>body{font:13px/1.6 system-ui,'Microsoft YaHei';margin:0;background:#eef3ef;color:#264b3c;min-width:0}main{display:block!important;box-sizing:border-box;max-width:1120px;margin:20px auto;padding:20px;background:#fff;border-radius:8px}h1{font-size:18px;margin:0 0 12px}.auto-unfollow-status{max-height:none!important}#tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-height:30px;padding:5px;border:1px solid #ccdcd2;border-radius:5px;background:#f8fbf9;color:#264b3c}.icon-button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #237a56;outline-offset:2px}input[type=search],select{min-height:30px;border:1px solid #b9c9bd;border-radius:5px;padding:4px 8px;background:white}.panel-info-tip-tooltip{max-width:340px;padding:8px 10px;border-radius:6px;background:#203c30;color:white;z-index:100000;pointer-events:none}@media(max-width:600px){main{margin:8px;padding:10px}}
</style>
<main><h1>自动取关 · 人工审核</h1><div id="tools"><button id="settings">设置</button><button id="seed">重置隔离数据</button></div><div id="app"></div></main>
<script type="module">
import {createApp,h} from 'vue';
import {createAutoUnfollow} from '/src/features/relationships/auto-unfollow.js';
const listeners=new Set();let reads=0,deletes=0,failDelete='',alarm={scheduledTime:Date.now()+600000};
let data=JSON.parse(localStorage.getItem('xf-review-acceptance')||'null');
const persist=()=>localStorage.setItem('xf-review-acceptance',JSON.stringify(data));
const storage={get:async keys=>Object.fromEntries((Array.isArray(keys)?keys:[keys]).map(k=>[k,structuredClone(data[k])])),set:async value=>{const changes={};for(const [k,v] of Object.entries(value)){changes[k]={oldValue:data[k],newValue:structuredClone(v)};data[k]=structuredClone(v);}persist();for(const listener of listeners)listener(changes,'local');}};
const alarms={get:async()=>alarm,clear:async()=>{alarm=null;},create:async(name,{when})=>{alarm={scheduledTime:when};}};
const users=()=>data.fixtureUsers||[];
const deps={storage,alarms,normalize:x=>x,candidates:async()=>users(),refreshCandidate:async user=>users().find(u=>u.id===user.id),profile:async()=>{reads++;throw Object.assign(Error('主页关注入口待核实'),{code:'X_PROFILE_ACTION_UNAVAILABLE'});},unfollow:async()=>{throw Error('禁止对外操作');},reconcile:async()=>{},removeLocal:async user=>{if(user.handle===failDelete)throw Error('模拟本地存储暂时不可用');data.fixtureUsers=users().filter(u=>u.id!==user.id);deletes++;persist();},log:async()=>{}};
const runner=createAutoUnfollow(deps);
globalThis.chrome={i18n:{getUILanguage:()=>localStorage.getItem('xf-review-language')||'zh-CN'},storage:{local:storage,onChanged:{addListener:f=>listeners.add(f),removeListener:f=>listeners.delete(f)}},alarms,runtime:{sendMessage:message=>message.cmd==='resolveAutoUnfollowReview'?runner.review(message):runner.run({reviewHandle:message.handle,retryConfirmed:message.retryConfirmed})}};
const {default:Status}=await import('/src/entries/panel/components/AutoUnfollowStatus.vue');
const {default:Settings}=await import('/src/entries/panel/components/UnreciprocatedSettingsDrawer.vue');
const {default:Tips}=await import('/src/entries/panel/components/InfoTipLayer.vue');
const {autoUnfollowStatusController:controller}=await import('/src/entries/panel/composables/useAutoUnfollowStatus.js');
const {unreciprocatedSettingsController:settings}=await import('/src/entries/panel/composables/useUnreciprocatedSettings.js');
async function seed(count=24){
 const config={settingsSchemaVersion:5,autoUnfollow:true,autoUnfollowAccount:{id:'1',handle:'fixture_owner'},dailyLimit:100,activeTimeStart:'00:00',activeTimeEnd:'00:00',autoUnfollowEvery:10,overdueDays:7,autoUnfollowMaxAttempts:3};
 const fixtureUsers=Array.from({length:count},(_,i)=>({id:String(100+i),handle:i?'review_'+i:'TracySnyder90',status:'overdue',followedAt:'2026-10-01T00:00:00Z',relationship:{following:true,followedBy:false}}));
 const reviewItems=fixtureUsers.map((user,i)=>({user,status:'review',attempts:3,updatedAt:Date.now()-i*60000,reason:i===0?'当前账号已屏蔽该用户':i===1?'这是较长的核验说明。'.repeat(24):'主页关注入口待核实',pending:i===2}));
 data={unreciprocatedSettings:config,fixtureUsers,autoUnfollowState:{accounts:{1:{account:'1',day:'2026-11-2',used:0,queue:[],reviewItems,pendingItems:count>2?[{user:fixtureUsers[2],checks:3,phase:'submitting',at:Date.now()-3600000}]:[]}}}};
 reads=0;deletes=0;failDelete='';persist();await controller.refresh();
}
if(!data)await seed();
settings.setSaveHandler(async cfg=>storage.set({unreciprocatedSettings:{...data.unreciprocatedSettings,...cfg}}));
createApp({render:()=>[h(Status),h(Settings),h(Tips)]}).mount('#app');
document.querySelector('#settings').onclick=()=>settings.open(data.unreciprocatedSettings);
document.querySelector('#seed').onclick=()=>seed();
globalThis.acceptance={seed,runner,controller,settings,get data(){return data;},get reads(){return reads;},get deletes(){return deletes;},set failDelete(handle){failDelete=handle;}};
</script></html>
