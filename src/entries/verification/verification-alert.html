<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="XFollower · 主人，需要你帮帮忙">XFollower · 主人，需要你帮帮忙</title><link rel="stylesheet" href="verification-alert.css"><script src="./i18n-content.js" defer></script></head>
<body>
  <main class="help-window" aria-labelledby="helpTitle">
    <header><span class="brand"><img src="icon128.png" alt="">XFollower</span><span class="attention"><i></i><span data-i18n="需要手动验证">需要手动验证</span></span></header>
    <div class="art-wrap"><img class="help-art" src="verification-help-generated.webp" alt="夜色与萤火虫中，泪汪汪的小机器人双手合十请求帮助" data-i18n-alt="夜色与萤火虫中，泪汪汪的小机器人双手合十请求帮助"><span class="speech"><span data-i18n="呜呜…我过不去 🥺">呜呜…我过不去 🥺</span></span></div>
    <section class="message">
      <h1 id="helpTitle"><span data-i18n="主人，救救我…">主人，救救我…</span></h1>
      <p class="lead" id="helpLead"><span data-i18n="我被安全验证拦住了，">我被安全验证拦住了，</span><br><span data-i18n="这一步只有你能帮我完成。">这一步只有你能帮我完成。</span></p>
      <div class="task-state"><span class="pause-mark">Ⅱ</span><span id="taskState"><span data-i18n="当前 Grok 任务已暂停">当前 Grok 任务已暂停</span></span></div>
      <div class="where"><span id="siteLabel"><span data-i18n="正在读取验证页面">正在读取验证页面</span></span><span id="detectedAt"></span></div>
      <p class="instructions" id="instructions"><span data-i18n="完成验证并恢复聊天输入框后，任务会自动继续。">完成验证并恢复聊天输入框后，任务会自动继续。</span></p>
      <button class="primary" id="openVerification" type="button"><span data-i18n="去手动验证">去手动验证 </span><span aria-hidden="true">↗</span></button>
      <button class="dismiss" id="dismissAlert" type="button"><span data-i18n="我知道了，先关闭">我知道了，先关闭</span></button>
      <p class="delivery" id="deliveryStatus" role="status" aria-live="polite"><span data-i18n="手机私信提醒正在准备中">手机私信提醒正在准备中</span></p>
      <p class="error" id="actionError" role="alert" hidden></p>
    </section>
    <footer><span data-i18n="等待期间不会重复提交；验证完成后继续当前任务。">等待期间不会重复提交；验证完成后继续当前任务。</span></footer>
  </main>
  <script type="module" src="verification-alert.js"></script>
</body>
</html>
