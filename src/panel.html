<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="XFollower · 粉丝跟进">XFollower · 粉丝跟进</title><link rel="stylesheet" href="./entries/panel/styles/panel.css"><link rel="stylesheet" href="./entries/panel/styles/admin.css"><link rel="stylesheet" href="./entries/panel/styles/brand-layout.css"><link rel="stylesheet" href="./entries/panel/styles/follow-queue-panel.css"><link rel="stylesheet" href="./entries/panel/styles/dashboard-load.css"><script src="./i18n-content.js" defer></script></head>
<body>
<main>
  <div id="panel-vue-root">
    <aside class="sidebar" aria-label="主导航" data-i18n-aria-label="主导航"><div class="brand-mark"><div class="brand-name">XFollower</div></div>
      <button class="nav-tab active" type="button" disabled><span data-i18n="粉丝跟进">粉丝跟进 </span><span id="queueCount" class="nav-count nav-count-loading" role="status" aria-label="加载中" data-i18n-aria-label="加载中" aria-busy="true"><span class="dash-spinner" aria-hidden="true"></span></span></button>
      <button class="nav-tab" type="button" disabled><span data-i18n="互关追踪">互关追踪 </span><span id="mutualNetworkCount" class="nav-count nav-count-loading" role="status" aria-label="加载中" data-i18n-aria-label="加载中" aria-busy="true"><span class="dash-spinner" aria-hidden="true"></span></span></button>
      <button class="nav-tab" type="button" disabled><span data-i18n="评论追踪">评论追踪 </span><span id="commentTrackingCount" class="nav-count nav-count-loading" role="status" aria-label="加载中" data-i18n-aria-label="加载中" aria-busy="true"><span class="dash-spinner" aria-hidden="true"></span></span></button>
      <button class="nav-tab" type="button" disabled><span data-i18n="关注队列">关注队列</span></button>
      <button class="nav-tab" type="button" disabled><span data-i18n="回关监控">回关监控 </span><span id="unreciprocatedCount" class="nav-count nav-count-loading" role="status" aria-label="加载中" data-i18n-aria-label="加载中" aria-busy="true"><span class="dash-spinner" aria-hidden="true"></span></span></button>
      <button class="nav-tab" type="button" disabled><span data-i18n="知识库">知识库</span></button>
    </aside>
  </div>
  <div id="profileDrawerMask" class="profile-drawer-mask" hidden></div>
  <!-- profileDrawer is reactively mounted by Vue 3 in #panel-vue-root -->
</main>
  <script type="module" src="./entries/panel/main.js"></script>
</body></html>
