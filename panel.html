<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XFollower · 粉丝管理</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="brand-layout.css"></head>
<body>
<main>
  <aside class="sidebar" aria-label="主导航">
    <div class="brand-mark"><div class="brand-logo"><img src="icon128.png" alt="XFollower logo"></div><div class="brand-name">XFollower</div><span>粉丝管理</span></div>
    <button class="nav-tab active" data-tab="monitor">粉丝管理 <span id="queueCount" class="nav-count">0</span></button>
    <button class="nav-tab" data-tab="candidates">候选账号</button>
    <button class="nav-tab" data-tab="explorer">关系探索 <span id="explorerQueueCount" class="nav-count">0</span></button>
    <button class="nav-tab" data-tab="settings">设置</button>
    <div class="sidebar-foot">v0.9.0<br>本地数据</div>
  </aside>
  <header><span class="eyebrow">XFollower · v0.9.0</span><h1>粉丝管理</h1></header>
  <section id="settingsSection" class="controls tab-panel" data-panel="settings" aria-label="筛选设置">
    <label class="target">目标用户<input id="target" placeholder="@username 或个人主页链接" autocomplete="off"></label>
    <label>最多检查<input id="limit" type="number" value="50" min="1" max="500"></label>
    <label>粉丝 / 关注下限<input id="minRatio" type="number" value="0.7" min="0.01" step="0.1"></label>
    <label>粉丝 / 关注上限<input id="maxRatio" type="number" value="1.4" min="0.01" step="0.1"></label>
    <label>两项人数至少<input id="minCount" type="number" value="50" min="0"></label>
    <label>访问间隔（秒）<input id="delay" type="number" value="5" min="3" max="60"></label>
    <label class="check"><input id="requirePromise" type="checkbox" checked>候选必须包含互关 / 回关相关描述</label>
    <div class="actions"><button id="start">开始查看资料</button><button id="stop" disabled class="secondary">停止</button><button id="export" class="secondary">导出 CSV</button><button id="clear" class="secondary">清空记录</button></div>
  </section>
  <section id="monitorSection" class="monitor-card monitor-panel tab-panel" data-panel="monitor" aria-label="粉丝管理">
    <div class="monitor-head"><div class="follower-tabs" role="tablist"><button class="follower-tab active" data-follower-tab="following" role="tab">已关注 <span id="followingCount">0</span></button><button class="follower-tab" data-follower-tab="followBack" role="tab">待回关 <span id="followBackCount">0</span></button></div><div class="icon-actions"><button class="icon-button secondary" title="首次获取会建立本地粉丝列表；之后只扫描新粉丝。" aria-label="说明">!</button><button id="scanFollowers" class="icon-button" title="获取初始粉丝列表或扫描新粉丝" aria-label="扫描粉丝">↻</button><button id="processFollowBack" class="icon-button secondary" title="按设置的节奏处理已进入待回关队列的账号" aria-label="处理待回关">↗</button></div></div>
    <div class="monitor-toolbar"><label title="自动扫描的时间间隔（分钟）"><span>检查间隔</span><input id="monitorEvery" type="number" value="60" min="10" max="1440"></label><label title="每批最多执行的回关数"><span>每批回关</span><input id="followBatch" type="number" value="10" min="1" max="20"></label><label title="两批回关之间的间隔（分钟）"><span>批次间隔</span><input id="batchEvery" type="number" value="10" min="5" max="180"></label><label class="check compact-check" title="开启后按检查间隔提醒扫描"><input id="monitorEnabled" type="checkbox"><span>定时扫描</span></label></div>
    <div id="selectionBar" class="selection-bar" hidden><label><input id="listSelectAll" type="checkbox"> 全选</label><span>已选 <b id="selectedCount">0</b> / 20</span><button id="analyzeSelected" class="secondary" disabled>Grok 分析</button></div>
    <p id="monitorStatus" class="monitor-status" role="status" aria-live="polite"></p>
    <div id="monitorEmpty" class="monitor-empty"><span class="empty-icon" aria-hidden="true">＋</span><strong id="monitorEmptyTitle">还没有粉丝列表</strong><button id="initialFollowers" class="secondary">获取初始列表</button></div>
    <div id="monitorList" class="monitor-list" hidden></div>
  </section>
  <section id="explorerSection" class="explorer-card tab-panel" data-panel="explorer" aria-label="关系探索">
    <div class="queue-head"><div><h2>关系探索</h2></div><div class="icon-actions"><button class="icon-button secondary" title="静默读取账号的关注与粉丝；可将其中账号继续加入跟进队列。" aria-label="说明">!</button><button id="processExplorerQueue" class="secondary">继续收集</button></div></div>
    <p id="explorerStatus" class="note">从候选账号点击“查看资料”开始。</p>
    <div class="explorer-grid"><div><h3>关注的账号 <span id="explorerFollowingCount" class="muted-count">0</span></h3><div id="explorerFollowing" class="explorer-list"><p class="note">还没有收集到账号。</p></div></div><div><h3>粉丝 <span id="explorerFollowersCount" class="muted-count">0</span></h3><div id="explorerFollowers" class="explorer-list"><p class="note">还没有收集到账号。</p></div></div></div>
    <h3>跟进队列 <span id="explorerPendingCount" class="muted-count">0</span></h3><div id="explorerQueue" class="explorer-list"><p class="note">选择账号加入后，会在最小化后台标签页中继续采集。</p></div>
  </section>
  <div id="candidatesSection" class="tab-panel" data-panel="candidates"><div class="toolbar"><div><p id="status" role="status" aria-live="polite">准备就绪</p></div><div class="icon-actions"><button class="icon-button secondary" title="逐个读取公开资料，按粉丝/关注比例与互关描述筛选。结果只保存于本机。" aria-label="说明">!</button><label>显示<select id="filter"><option value="all">全部结果</option><option>候选</option><option>疑似骗关注</option><option>危险</option><option>需复核</option></select></label></div></div>
  <div class="table-wrap"><table><thead><tr><th>账号与简介</th><th>粉丝</th><th>关注</th><th>粉丝 / 关注</th><th>互关描述</th><th>筛选结果</th></tr></thead><tbody id="results"></tbody></table><p id="empty">还没有检查记录。输入目标账号开始。</p></div></div>
</main><script type="module" src="panel.js"></script>
</body></html>
