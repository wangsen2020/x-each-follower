<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XFollower · 粉丝管理</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="brand-layout.css"></head>
<body>
<main>
  <aside class="sidebar" aria-label="主导航">
    <div class="brand-mark"><div class="brand-logo"><img src="icon128.png" alt="XFollower logo"></div><div class="brand-name">XFollower</div><span>粉丝管理</span></div>
    <button class="nav-tab active" data-tab="monitor">粉丝管理 <span id="queueCount" class="nav-count">0</span></button>
    <button class="nav-tab" data-tab="candidates">互粉网络 <span id="mutualNetworkCount" class="nav-count">0</span></button>
    <button class="nav-tab" data-tab="explorer">关系探索 <span id="explorerQueueCount" class="nav-count">0</span></button>
    <button class="nav-tab" data-tab="settings">设置</button>
    <div class="sidebar-foot">v0.14.0<br>本地数据</div>
  </aside>
  <header><span class="eyebrow">XFollower · v0.14.0</span><h1>粉丝管理</h1></header>
  <section id="settingsSection" class="controls tab-panel" data-panel="settings" aria-label="筛选设置">
    <label class="target">默认互粉锚点<input id="target" placeholder="@username 或个人主页链接" autocomplete="off"></label>
    <label>资料采集上限<input id="limit" type="number" value="50" min="1" max="500"></label>
    <label>粉丝 / 关注下限<input id="minRatio" type="number" value="0.7" min="0.01" step="0.1"></label>
    <label>粉丝 / 关注上限<input id="maxRatio" type="number" value="1.4" min="0.01" step="0.1"></label>
    <label>两项人数至少<input id="minCount" type="number" value="50" min="0"></label>
    <label>访问间隔（秒）<input id="delay" type="number" value="5" min="3" max="60"></label>
    <label class="check"><input id="requirePromise" type="checkbox" checked>候选必须包含互关 / 回关相关描述</label>
    <div class="actions"><button id="start">打开互粉网络</button><button id="stop" disabled class="secondary">停止</button><button id="export" class="secondary">导出 CSV</button><button id="clear" class="secondary">清空记录</button></div>
  </section>
  <section id="monitorSection" class="monitor-card monitor-panel tab-panel" data-panel="monitor" aria-label="粉丝管理">
    <div class="monitor-head"><div class="follower-tabs" role="tablist"><button class="follower-tab active" data-follower-tab="following" role="tab">已关注 <span id="followingCount">0</span></button><button class="follower-tab" data-follower-tab="followBack" role="tab">待回关 <span id="followBackCount">0</span></button><span class="info-tip" data-tip="首次获取会建立本地粉丝列表；之后扫描只补充新粉丝。" aria-label="粉丝列表说明">?</span></div><div class="monitor-head-actions"><div id="monitorPagination" class="monitor-pagination" hidden><label>搜索<input id="followerSearch" type="search" placeholder="账号、名称或简介" autocomplete="off"></label><label>每页<select id="followerPageSize"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label><span id="followerPageSummary" class="page-summary"></span><div class="page-actions"><button id="followerPrevPage" class="secondary" title="上一页" aria-label="上一页">‹</button><button id="followerNextPage" class="secondary" title="下一页" aria-label="下一页">›</button></div></div><div class="icon-actions"><button id="scanFollowers" class="icon-button" title="获取初始粉丝列表或扫描新粉丝" aria-label="扫描粉丝">↻</button><button id="processFollowBack" class="icon-button secondary" title="按设置的节奏处理已进入待回关队列的账号" aria-label="处理待回关">↗</button></div></div></div>
    <div class="monitor-toolbar"><label><span>检查间隔 <span class="info-tip" data-tip="自动扫描粉丝的时间间隔，单位为分钟。" aria-label="检查间隔说明">?</span></span><input id="monitorEvery" type="number" value="60" min="10" max="1440"></label><label><span>每批回关 <span class="info-tip" data-tip="每次处理待回关队列时最多点击的账号数。" aria-label="每批回关说明">?</span></span><input id="followBatch" type="number" value="10" min="1" max="20"></label><label><span>批次间隔 <span class="info-tip" data-tip="两批回关之间等待的时间，单位为分钟。" aria-label="批次间隔说明">?</span></span><input id="batchEvery" type="number" value="10" min="5" max="180"></label><label class="check compact-check"><input id="monitorEnabled" type="checkbox"><span>定时扫描 <span class="info-tip" data-tip="开启后按检查间隔提醒扫描新粉丝。" aria-label="定时扫描说明">?</span></span></label></div>
    <div id="selectionBar" class="selection-bar" hidden><label><input id="listSelectAll" type="checkbox"> 全选本页 <span class="info-tip" data-tip="只选择当前页；Grok 每次最多分析 20 个账号。" aria-label="批量选择说明">?</span></label><span>已选 <b id="selectedCount">0</b> / 20</span><button id="analyzeSelected" class="secondary" disabled>Grok 分析</button></div>
    <p id="monitorStatus" class="monitor-status" role="status" aria-live="polite"></p>
    <div id="monitorEmpty" class="monitor-empty"><span class="empty-icon" aria-hidden="true">＋</span><strong id="monitorEmptyTitle">还没有粉丝列表</strong><button id="initialFollowers" class="secondary">获取初始列表</button></div>
    <div id="monitorList" class="monitor-list" hidden></div>
  </section>
  <section id="explorerSection" class="explorer-card tab-panel" data-panel="explorer" aria-label="关系探索">
    <div class="queue-head"><div><h2>关系探索 <span class="info-tip" data-tip="静默读取账号的关注和粉丝，并可继续加入跟进队列。" aria-label="关系探索说明">?</span></h2></div><div class="icon-actions"><button id="processExplorerQueue" class="secondary">继续收集</button></div></div>
    <p id="explorerStatus" class="note">从候选账号点击“查看资料”开始。</p>
    <div class="explorer-grid"><div><h3>关注的账号 <span id="explorerFollowingCount" class="muted-count">0</span></h3><div id="explorerFollowing" class="explorer-list"><p class="note">还没有收集到账号。</p></div></div><div><h3>粉丝 <span id="explorerFollowersCount" class="muted-count">0</span></h3><div id="explorerFollowers" class="explorer-list"><p class="note">还没有收集到账号。</p></div></div></div>
    <h3>跟进队列 <span id="explorerPendingCount" class="muted-count">0</span></h3><div id="explorerQueue" class="explorer-list"><p class="note">选择账号加入后，会在最小化后台标签页中继续采集。</p></div>
  </section>
  <div id="candidatesSection" class="tab-panel" data-panel="candidates"><div class="mutual-network-head"><label>互粉锚点 <span class="info-tip" data-tip="输入一个以互关为主、粉丝数和关注数接近的账号。插件读取其 following 与 followers，并将两侧账号去重合并。" aria-label="互粉锚点说明">?</span><input id="networkAnchor" placeholder="@username 或主页链接" autocomplete="off"></label><label>每侧上限 <span class="info-tip" data-tip="每次最多读取锚点 following 和 followers 的数量；更大的范围需要更多时间。" aria-label="收集上限说明">?</span><select id="networkLimit"><option value="100">100</option><option value="250">250</option><option value="500" selected>500</option></select></label><button id="collectNetwork">开始新网络</button></div><p id="networkStatus" class="network-status" role="status" aria-live="polite">输入互粉锚点后开始收集。</p>
  <div class="table-wrap"><table><thead><tr><th>账号与简介</th><th>与锚点关系</th><th>粉丝</th><th>关注</th><th>操作</th></tr></thead><tbody id="mutualResults"></tbody></table><p id="mutualEmpty">还没有互粉网络记录。</p></div></div>
  <div id="profileDrawerMask" class="profile-drawer-mask" hidden></div>
  <aside id="profileDrawer" class="profile-drawer" role="dialog" aria-modal="true" aria-labelledby="profileDrawerTitle" hidden>
    <div class="profile-drawer-head"><strong id="profileDrawerTitle">账号资料</strong><button id="closeProfileDrawer" class="icon-button secondary" title="关闭" aria-label="关闭">×</button></div>
    <div id="profileDrawerContent" class="profile-drawer-content"></div>
    <div class="profile-drawer-actions"><button id="drawerRefreshProfile" class="secondary">采集资料</button><button id="drawerExploreRelations" class="secondary">收集关系</button><button id="drawerOpenX">在 X 打开</button></div>
  </aside>
</main><script type="module" src="panel.js"></script>
</body></html>
